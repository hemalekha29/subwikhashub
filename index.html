<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="format-detection" content="telephone=no" />

    <!-- SEO:START -->
    <!-- Default (dev-server / unknown-route) head. In production scripts/prerender.mjs replaces
         everything between the SEO markers with each route's own title, description, canonical,
         Open Graph/Twitter tags and JSON-LD, and fills #root with the page's real content.
         The site-wide schema (Organization, Store, WebSite) is generated there too — see
         src/lib/seo.js — so it no longer lives in this file. -->
    <title data-rh="true">Handmade Customized Gifts in Coimbatore | Subwikha's Hub</title>
    <meta data-rh="true" name="description" content="Handmade customized gifts from Coimbatore: chocolate bouquets, resin art, personalized photo frames, keychains and night lights. Delivered across India." />
    <link data-rh="true" rel="canonical" href="https://subwikhahub.vercel.app/" />
    <!-- SEO:END -->
    <meta name="author" content="Subwikha's Hub" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700&family=Nunito:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Razorpay's checkout.js was previously loaded here in <head> on every single page —
         it's now loaded on-demand only on /checkout (see src/pages/Checkout/Checkout.jsx),
         so Home/Shop/About/etc. don't pay for a third-party payment script they never use. -->

    <!-- Google Analytics 4 (measurement ID matches the one already configured on this
         Firebase project — see src/firebase.js). Loaded async so it never blocks rendering. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1C7MSJXVCN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-1C7MSJXVCN');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
